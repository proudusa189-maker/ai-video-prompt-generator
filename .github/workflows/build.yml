name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download app source
        run: |
          curl -sSL -o src.zip "https://muse.ai/files/1407546119102743/1815514666294130/cafxt9n6l0lqu4ifb5v5vast/vpg-source.zip"
          unzip -q src.zip

      - name: Build debug APK
        working-directory: video-prompt-generator
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: video-prompt-generator/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
